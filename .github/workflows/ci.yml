name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - name: Test
        shell: bash
        run: |
          status=0
          cargo test --workspace --no-fail-fast > test.log 2>&1 || status=$?
          cat test.log
          if [ "$status" -ne 0 ]; then
            summary=$(grep -E -A3 'panicked at|^test .* FAILED|^error|SIGSEGV|SIGABRT|signal:' test.log | head -60)
            summary="${summary//'%'/'%25'}"
            summary="${summary//$'\n'/'%0A'}"
            echo "::error title=Test failures::${summary}"
          fi
          exit "$status"
